<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Inputs e Formulários</h1>

    <input type="text"  id=""
    placeholder="Testando inputs" id="teste" 
    value="123 testando"
    maxlength="15" size="50">
    <fieldset>
        <legend>Tipo checkbox</legend>
<br>
    <input type="checkbox" name="combustivel" value="gasolina">Gasolina
<br>
    <input type="checkbox" name="combustivel" value="etanol">Álcool
<br>
    <input type="checkbox" name="combustivel" value="eletricidade">Elétrico
    </fieldset>
    


    <fieldset>
        <legend>Tipo radio</legend>
<br>
    <input type="radio" name="habitacao" value="casa">Casa
<br>
    <input type="radio" name="habitacao" value="apartamento">Apartamento
<br>
    <input type="radio" name="habitacao" value="chale">Chalé
<br>
    <input type="radio" name="habitacao" value="motorhome">Motorhome
    </fieldset>

    <h2>Tipos especiais de input text</h2>
    <input type="date" placeholder="Data">
    <br>
    <input type="email" placeholder="email">
    <br>
    <input type="url" placeholder="url">
    <br>
    <input type="number" placeholder="number">
    <br>
    <input type="time" placeholder="data e hora">
    <br>
    <input type="color" placeholder="cores">
    <br>
    <input type="file" placeholder="arquivos">
    <br>
    <h2>Forms</h2>
    <form action="index.html" method="post">
        <input type="text" name="login" placeholder="Digite seu conta">
        <br>
        <input type="password" name="senha" placeholder="Digite sua senha">
        <br>
        <input type="submit" value="Entrar">
        <br>
        <input type="reset" value="Limpar formulario"
    </form>

    <br>
    <br><br><br><br><br><br><br><br><br><br><br><br><br>
</body>
</html>
